name: weekly fetch

# 每週六 00:10 UTC = 台北 08:10
on:
  schedule:
    - cron: "10 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Actions 自帶的 GITHUB_TOKEN 讓 API 額度從 10/min、60/hr
      # 拉到 30/min、5000/hr —— 這是把抓取放在 Actions 的主要理由。
      - name: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch.py

      # 只 commit 資料。評註與渲染在 mini 上做（見 README 的「為什麼分兩段」）。
      - name: commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d) 快照與榜單"
          git push
